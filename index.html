<!DOCTYPE html>
<html lang="hu" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>MONO — Fix költség és előfizetés követő</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #090a0d;
      color: #f4f4f5;
    }
    .drag-over {
      outline: 2px dashed rgba(59, 130, 246, 0.7);
      outline-offset: 2px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-zinc-100 selection:text-zinc-950">

  <!-- FEJLÉC -->
  <header class="sticky top-0 z-30 bg-[#090a0d]/85 backdrop-blur-xl border-b border-white/[0.08]">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-8 h-8 rounded-lg bg-zinc-100 text-zinc-950 font-bold flex items-center justify-center text-sm shrink-0">M</div>
        <div class="truncate">
          <div class="flex items-center gap-2">
            <span class="font-semibold tracking-tight text-white">MONO</span>
            <span class="text-[10px] uppercase tracking-wider px-1.5 py-0.5 rounded bg-white/[0.06] text-zinc-400 border border-white/[0.08]">Fix költség</span>
          </div>
          <p class="text-xs text-zinc-500 truncate">Havi fix kiadás és előfizetés követő</p>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <span id="sync-status-badge" class="hidden sm:inline-flex items-center gap-1.5 text-xs px-2.5 py-1.5 rounded-lg bg-emerald-500/10 text-emerald-300 border border-emerald-500/20">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
          <span id="sync-status-text">Helyi mentés kész</span>
        </span>

        <button id="btn-open-sync" type="button" class="inline-flex items-center gap-1.5 text-xs font-medium px-3 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white transition cursor-pointer">
          GitHub Szinkron
        </button>

        <button id="btn-export-json" type="button" class="text-xs font-medium px-3 py-2 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-zinc-200 border border-white/[0.08] transition cursor-pointer">
          Export (.json)
        </button>

        <label class="text-xs font-medium px-3 py-2 rounded-lg bg-white/[0.05] hover:bg-white/[0.1] text-zinc-200 border border-white/[0.08] transition cursor-pointer">
          Import
          <input id="input-import-json" type="file" accept=".json,application/json" class="hidden" />
        </label>
      </div>
    </div>
  </header>

  <!-- FŐ TARTALOM -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-6 sm:py-8 space-y-6">

    <!-- ÖSSZESÍTŐ KÁRTYÁK -->
    <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div class="rounded-2xl bg-[#111318] border border-white/[0.08] p-5">
        <div class="flex items-center justify-between text-xs text-zinc-400 mb-2">
          <span>ÖSSZES FIX KIADÁS / HÓ</span>
          <span id="total-items-count" class="px-2 py-0.5 rounded-full bg-white/[0.06] text-zinc-300">0 tétel</span>
        </div>
        <div id="monthly-total" class="text-2xl sm:text-3xl font-bold tracking-tight text-white">0 Ft</div>
      </div>

      <div class="rounded-2xl bg-[#111318] border border-white/[0.08] p-5">
        <div class="flex items-center justify-between text-xs text-zinc-400 mb-2">
          <span>ÉVES VETÍTETT KIADÁS</span>
          <span>12 hónapra vetítve</span>
        </div>
        <div id="yearly-total" class="text-2xl sm:text-3xl font-bold tracking-tight text-white">0 Ft</div>
      </div>
    </section>

    <div class="flex items-center justify-between">
      <p class="text-[11px] uppercase tracking-widest text-zinc-500">Kategóriák és tételek • Áthúzással rendezhető</p>
    </div>

    <!-- KATEGÓRIA KÁRTYÁK RÁCS -->
    <section id="categories-grid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></section>
  </main>

  <!-- ÉRTESÍTÉS (TOAST) -->
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden max-w-sm rounded-xl px-4 py-3 text-xs font-medium shadow-xl border"></div>

  <!-- GITHUB SZINKRON MODÁLIS ABLAK -->
  <div id="sync-modal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 bg-black/75 backdrop-blur-xs">
    <div class="w-full max-w-md rounded-2xl bg-[#12151c] border border-white/[0.1] p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <div>
          <h2 class="text-base font-semibold text-white">GitHub Szinkron</h2>
          <p class="text-xs text-zinc-400 mt-0.5">Automatikus mentés a repository <code class="text-zinc-200">adatok.json</code> fájljába</p>
        </div>
        <button id="btn-close-sync" type="button" class="text-zinc-400 hover:text-white text-sm px-2 py-1 rounded-lg hover:bg-white/[0.06] cursor-pointer">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label class="block text-zinc-400 mb-1">Felhasználónév</label>
          <input id="gh-owner" type="text" placeholder="katsatale" class="w-full rounded-xl bg-[#0b0d11] border border-white/[0.1] px-3 py-2.5 text-white focus:outline-none focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-zinc-400 mb-1">Repository</label>
            <input id="gh-repo" type="text" placeholder="mono" class="w-full rounded-xl bg-[#0b0d11] border border-white/[0.1] px-3 py-2.5 text-white focus:outline-none focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-zinc-400 mb-1">Fájl neve</label>
            <input id="gh-path" type="text" placeholder="adatok.json" class="w-full rounded-xl bg-[#0b0d11] border border-white/[0.1] px-3 py-
